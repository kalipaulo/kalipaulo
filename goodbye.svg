<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6FB0"/><stop offset=".5" stop-color="#C8A27A"/><stop offset="1" stop-color="#8B5E3C"/>
    </linearGradient>
    <style>
      .big{font:800 30px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#1E3A5F}
      .small{font:600 16px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#8B5E3C;letter-spacing:1px}
      .bot{animation:hop 2.4s ease-in-out infinite}
      @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .arm{transform-origin:205px 112px;animation:wave 1.2s ease-in-out infinite}
      @keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-55deg)}}
      .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
      @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1.6s ease-in-out infinite alternate}
      @keyframes grow{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
      .shadow{transform-box:fill-box;transform-origin:center;animation:sh 2.4s ease-in-out infinite}
      @keyframes sh{0%,100%{transform:scaleX(1);opacity:.25}50%{transform:scaleX(.8);opacity:.15}}
      .txt{animation:txt 2.4s ease-in-out infinite}
      @keyframes txt{0%,100%{opacity:1}50%{opacity:.85}}
    </style>
  </defs>
  <rect x="2" y="2" width="896" height="206" rx="16" fill="#F7F1E8" stroke="url(#bd)" stroke-width="4"/>

  <!-- original mascot: a little data bot -->
  <ellipse class="shadow" cx="160" cy="185" rx="48" ry="7" fill="#8B5E3C"/>
  <g class="bot">
    <rect x="156" y="22" width="4" height="20" fill="#8B5E3C"/>
    <circle cx="158" cy="20" r="7" fill="#2F6FB0"/>
    <rect x="105" y="40" width="106" height="78" rx="20" fill="#8B5E3C"/>
    <rect x="117" y="52" width="82" height="54" rx="12" fill="#DCEBFA"/>
    <rect class="eye" x="137" y="66" width="10" height="16" rx="5" fill="#1E3A5F"/>
    <rect class="eye" x="169" y="66" width="10" height="16" rx="5" fill="#1E3A5F"/>
    <path d="M144 92 Q158 102 172 92" fill="none" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
    <rect x="118" y="118" width="80" height="54" rx="14" fill="#C8A27A"/>
    <rect class="bar" x="134" y="140" width="10" height="22" rx="2" fill="#1E3A5F"/>
    <rect class="bar" x="152" y="132" width="10" height="30" rx="2" fill="#2F6FB0" style="animation-delay:.3s"/>
    <rect class="bar" x="170" y="146" width="10" height="16" rx="2" fill="#8B5E3C" style="animation-delay:.6s"/>
    <rect x="98" y="122" width="22" height="12" rx="6" fill="#8B5E3C"/>
    <g class="arm">
      <rect x="196" y="106" width="44" height="12" rx="6" fill="#8B5E3C"/>
      <circle cx="242" cy="112" r="9" fill="#2F6FB0"/>
    </g>
  </g>

  <g class="txt">
    <text class="big" x="300" y="95">Merci d'être passé sur mon profil !</text>
    <text class="small" x="300" y="130">On se retrouve dans les données · Python · R · SQL · Power BI</text>
  </g>
</svg>
