<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3D91"/>
      <stop offset=".55" stop-color="#1D5FC4"/>
      <stop offset="1" stop-color="#2E7BE0"/>
    </linearGradient>
    <radialGradient id="shine" cx=".5" cy=".35" r=".6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ci" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F77F00"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#009E60"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .title{paint-order:stroke;stroke:#0B3D91;stroke-width:1px;font:800 54px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#ffffff;letter-spacing:1px}
      .sub{font:600 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#EAF2FF;letter-spacing:3px}
      .tag{font:600 15px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#CFE0FA;letter-spacing:2px}
      .fade{opacity:0;animation:fadeUp 1.1s ease-out forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}
      @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .flag{transform-origin:150px 160px;animation:wave 3s ease-in-out infinite}
      @keyframes wave{0%,100%{transform:skewY(0deg)}50%{transform:skewY(-4deg)}}
      .w1{animation:slide 9s linear infinite}
      .w2{animation:slide 13s linear infinite reverse}
      .w3{animation:slide 17s linear infinite}
      @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-600px)}}
      .dot{animation:float 6s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0);opacity:.25}50%{transform:translateY(-18px);opacity:.8}}
      .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 2.4s ease-in-out infinite alternate}
      @keyframes grow{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
      .line{stroke-dasharray:400;stroke-dashoffset:0;animation:draw 4s ease-in-out infinite}
      @keyframes draw{0%{stroke-dashoffset:400}60%,100%{stroke-dashoffset:0}}
      .underline{animation:glow 3s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#shine)"/>

    <!-- floating data points -->
    <g fill="#F77F00">
      <circle class="dot" cx="320" cy="60" r="3"/>
      <circle class="dot" cx="980" cy="80" r="4" style="animation-delay:1.5s"/>
      <circle class="dot" cx="430" cy="250" r="2.5" style="animation-delay:3s"/>
    </g>
    <g fill="#009E60">
      <circle class="dot" cx="870" cy="45" r="3" style="animation-delay:.8s"/>
      <circle class="dot" cx="360" cy="190" r="3.5" style="animation-delay:2.2s"/>
      <circle class="dot" cx="1080" cy="230" r="2.5" style="animation-delay:4s"/>
    </g>
    <g fill="#ffffff">
      <circle class="dot" cx="760" cy="30" r="2" style="animation-delay:2.6s"/>
      <circle class="dot" cx="520" cy="40" r="2" style="animation-delay:1.1s"/>
    </g>

    <!-- waving Côte d'Ivoire flag -->
    <g class="flag">
      <rect x="92" y="110" width="4" height="150" rx="2" fill="#E6EEF9"/>
      <rect x="96" y="112" width="44" height="88" fill="#F77F00"/>
      <rect x="140" y="112" width="44" height="88" fill="#FFFFFF"/>
      <rect x="184" y="112" width="44" height="88" fill="#009E60"/>
    </g>

    <!-- mini animated chart (right) -->
    <g transform="translate(985,95)">
      <rect class="bar" x="0"  y="40" width="18" height="80" rx="3" fill="#F77F00"/>
      <rect class="bar" x="28" y="10" width="18" height="110" rx="3" fill="#FFFFFF" style="animation-delay:.4s"/>
      <rect class="bar" x="56" y="55" width="18" height="65" rx="3" fill="#009E60" style="animation-delay:.8s"/>
      <rect class="bar" x="84" y="25" width="18" height="95" rx="3" fill="#F77F00" style="animation-delay:1.2s"/>
      <rect class="bar" x="112" y="0" width="18" height="120" rx="3" fill="#009E60" style="animation-delay:1.6s"/>
      <polyline class="line" points="-10,90 20,60 50,75 80,35 110,45 140,5" fill="none" stroke="#FFE3B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- text -->
    <text class="title" x="600" y="140" text-anchor="middle">KRE Paul Roche Enock</text>
    <rect class="underline" x="430" y="160" width="340" height="5" rx="2.5" fill="url(#ci)"/>
    <text class="sub" x="600" y="205" text-anchor="middle">DATA SCIENTIST  ·  DATA ANALYST  ·  BI</text>
    <text class="tag" x="600" y="238" text-anchor="middle">ABIDJAN, CÔTE D'IVOIRE</text>

    <!-- waves in flag colors -->
    <g transform="translate(0,262)">
      <path class="w3" fill="#009E60" opacity=".85" d="M0 34 Q75 14 150 34 T300 34 T450 34 T600 34 T750 34 T900 34 T1050 34 T1200 34 T1350 34 T1500 34 T1650 34 T1800 34 V60 H0Z"/>
      <path class="w2" fill="#FFFFFF" opacity=".9" d="M0 42 Q75 26 150 42 T300 42 T450 42 T600 42 T750 42 T900 42 T1050 42 T1200 42 T1350 42 T1500 42 T1650 42 T1800 42 V60 H0Z"/>
      <path class="w1" fill="#F77F00" d="M0 50 Q75 36 150 50 T300 50 T450 50 T600 50 T750 50 T900 50 T1050 50 T1200 50 T1350 50 T1500 50 T1650 50 T1800 50 V60 H0Z"/>
    </g>
  </g>
</svg>
